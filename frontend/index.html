<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a14">
  <meta name="description" content="JCTGBTG church lyrics library">
  <title>JCTGBTG — Lyrics Library</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="JCTGBTG Lyrics home">
        <span class="brand-mark">♪</span>
        <span>
          <strong>JCTGBTG</strong>
        </span>
      </a>
      <button class="icon-btn subtle" id="themeBtn" type="button" aria-label="Toggle theme" title="Toggle theme">☾</button>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <span class="hero-kicker">Liliw Extension Church</span>
          <h1>Lyrics Library<br><em></em></h1>
          <div class="hero-actions">
            <button class="primary hero-btn" id="heroAddBtn" type="button">＋ Add a song</button>
            <button class="ghost hero-btn" id="focusSearchBtn" type="button">⌕ Find a song</button>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <span>♪</span>
          <span>♫</span>
          <span>♩</span>
        </div>
      </section>

      <section class="library-section" aria-labelledby="libraryHeading">
        <div class="section-head">
          <div>
            <p class="eyebrow">YOUR LIBRARY</p>
            <div class="title-row">
              <h2 id="libraryHeading">All Songs</h2>
              <span id="count" class="count-pill">0</span>
            </div>
          </div>
          <button class="sort-btn" id="sortBtn" type="button">Recent <span>↕</span></button>
        </div>

        <label class="search" for="searchInput">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search by title, artist, or lyrics...">
          <button id="clearSearch" class="clear-search hidden" type="button" aria-label="Clear search">×</button>
        </label>

        <div class="quick-stats" aria-label="Library statistics">
          <div><span class="stat-value" id="totalCount">0</span><span class="stat-label">songs</span></div>
          <div><span class="stat-dot"></span><span class="stat-label">Library online</span></div>
        </div>

        <div id="status" class="status hidden" role="status"></div>
        <div id="songList" class="song-list" aria-live="polite"></div>

        <div id="loadingState" class="loading-list" aria-hidden="true">
          <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>

        <div id="emptyState" class="empty hidden">
          <div class="empty-icon">♪</div>
          <h3>No songs found</h3>
          <p id="emptyMessage">Try another search or add a new song.</p>
          <button class="secondary empty-btn" id="emptyAddBtn" type="button">Add a song</button>
        </div>
      </section>
    </main>

    <button class="fab" id="addBtn" type="button" aria-label="Add a song" title="Add a song">＋</button>
  </div>

  <!-- Editor -->
  <div class="modal hidden" id="editorModal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="modal-card editor-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow" id="editorEyebrow">NEW SONG</p>
          <h2 id="editorTitle">Add Song</h2>
          <p class="modal-subtitle">Keep the lyrics easy to find and easy to read.</p>
        </div>
        <button class="icon-btn" id="closeEditor" type="button" aria-label="Close">×</button>
      </div>

      <form id="songForm">
        <label>Song Title
          <input id="titleInput" required maxlength="100" placeholder="e.g. Amazing Grace">
        </label>

        <label>Artist / Composer <span class="optional">Optional</span>
          <input id="artistInput" maxlength="100" placeholder="e.g. John Newton">
        </label>

        <label>Lyrics
          <textarea id="lyricsInput" required placeholder="Paste or type the lyrics here..."></textarea>
        </label>

        <div class="actions">
          <button type="button" class="secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="primary" id="saveBtn">Save Song</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Song viewer -->
  <div class="modal hidden" id="viewModal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
    <article class="modal-card lyrics-card">
      <div class="modal-head viewer-head">
        <div>
          <p class="eyebrow">SONG</p>
          <h2 id="viewTitle"></h2>
          <p id="viewArtist" class="artist"></p>
        </div>
        <div class="viewer-tools">
          <button class="icon-btn" id="fontDownBtn" type="button" aria-label="Decrease lyrics size">A−</button>
          <button class="icon-btn" id="fontUpBtn" type="button" aria-label="Increase lyrics size">A+</button>
          <button class="icon-btn" id="fullscreenBtn" type="button" aria-label="Fullscreen lyrics">⛶</button>
          <button class="icon-btn" id="closeView" type="button" aria-label="Close">×</button>
        </div>
      </div>

      <div class="viewer-meta">
        <span id="viewFavoriteLabel">Not favorited</span>
        <button class="favorite-btn" id="favoriteBtn" type="button">♡ Favorite</button>
      </div>

      <div id="viewLyrics" class="lyrics"></div>

      <div class="actions viewer-actions">
        <button class="secondary" id="copyBtn" type="button">▣ Copy lyrics</button>
        <button class="secondary" id="shareBtn" type="button">↗ Share</button>
        <button class="secondary" id="editBtn" type="button">✎ Edit</button>
        <button class="danger" id="deleteBtn" type="button">Delete</button>
      </div>
    </article>
  </div>

  <script src="./script.js"></script>
</body>
</html>
